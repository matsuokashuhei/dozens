name: iOS

on:
  push:
    branches: [main, ios]
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test DozensKit
        working-directory: apps/ios/Packages/DozensKit
        run: |
          xcodebuild test \
            -scheme DozensKit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
      # Dozens.xcodeproj は Xcode 27 のプロジェクト形式なので、ランナーに Xcode 27 が入るまではビルドを飛ばす。
      - name: Build app
        working-directory: apps/ios/Dozens
        run: |
          if ! xcodebuild -version | grep -qE '^Xcode (2[7-9]|[3-9][0-9])'; then
            echo "::warning::Skipping app build: Dozens.xcodeproj requires Xcode 27 ($(xcodebuild -version | head -1) selected)"
            exit 0
          fi
          xcodebuild build \
            -project Dozens.xcodeproj \
            -scheme Dozens \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
