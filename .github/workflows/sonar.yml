name: Sonar

on:
  workflow_call:

jobs:
  sonar:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 120s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rust-reports
      - name: Place reports
        run: |
          mkdir -p apps/api
          if [ -f lcov.info ]; then
            mv lcov.info apps/api/lcov.info
          fi
          if [ -f clippy.json ]; then
            mv clippy.json apps/api/clippy.json
          fi
          test -s apps/api/lcov.info
          test -s apps/api/clippy.json
      - name: Generate token
        run: |
          token=$(curl -fsS -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-$GITHUB_RUN_ID" | jq -r .token)
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Scan
        env:
          SONAR_HOST_URL: http://localhost:9000
        run: |
          set -o pipefail
          curl -fsSL -o /tmp/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          unzip -q /tmp/sonar-scanner.zip -d /tmp
          /tmp/sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner \
            -Dsonar.qualitygate.wait=true \
            -Dproject.settings=.github/workflows/sonar-project.properties \
            2>&1 | tee /tmp/sonar-scanner.log
          if grep -F "ERROR Failed to run Clippy" /tmp/sonar-scanner.log; then
            echo "Clippy sensor failed. The scanner still exits 0 after that error."
            exit 1
          fi
          if grep -F "No LCOV report files found" /tmp/sonar-scanner.log; then
            echo "LCOV report was not imported."
            exit 1
          fi
