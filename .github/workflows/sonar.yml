name: Sonar

on:
  workflow_call:

jobs:
  sonar:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 120s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rust-reports
      - name: Generate token
        run: |
          token=$(curl -fsS -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-$GITHUB_RUN_ID" | jq -r .token)
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: -Dsonar.qualitygate.wait=true -Dproject.settings=.github/workflows/sonar-project.properties
