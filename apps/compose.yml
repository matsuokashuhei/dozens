services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    working_dir: /dozens/apps/api
    ports:
      - 3000:3000
    volumes:
      - ..:/dozens
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: