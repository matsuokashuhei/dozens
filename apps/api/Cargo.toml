[package]
name = "api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = "1"
aws-sdk-cognitoidentityprovider = "1.139.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-jwt-auth = "0.7.0"
fake = "5.1.0"
jsonwebtoken = "10.4.0"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["dynamodb", "jiff", "migration", "postgresql"] }
toasty-cli = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tokio-postgres = "0.7"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"], default-features = false }
aws-sdk-cloudwatchlogs = "1.156.0"

[lints.rust]
warnings = "deny"
