name: Dozens
options:
  bundleIdPrefix: app.dozens
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 3.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  DozensKit:
    path: Packages/DozensKit
targets:
  Dozens:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DozensKit
        product: AppFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dozens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        DozensAPIBaseURL: $(API_BASE_URL)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dozens.ios
        API_BASE_URL: http://localhost:3000
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
schemes:
  Dozens:
    build:
      targets:
        Dozens: all
    run:
      config: Debug
      environmentVariables:
        - variable: DOZENS_BACKEND
          value: stub
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: DozensKit/DomainTests
        - package: DozensKit/ApplicationTests
        - package: DozensKit/InfrastructureTests
        - package: DozensKit/AuthFeatureTests
